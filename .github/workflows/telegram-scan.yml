name: Telegram alerts

# Runs the server scan that sends MarketScope alerts to Telegram. Needs the repository
# secret CRON_SECRET to match the CRON_SECRET environment variable on Vercel.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET belum diisi, lewati"; exit 0; fi
          curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" https://kriptoscope.vercel.app/api/cron/scan
